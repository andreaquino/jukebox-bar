<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Jukebox 2026</title>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <style>
        :root { --spotify-green: #1DB954; --dark: #121212; --card: #181818; }
        body { background-color: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .search-box { width: 100%; padding: 15px; border-radius: 30px; border: none; background: #282828; color: white; margin-bottom: 20px; box-sizing: border-box; }
        .track-card { display: flex; align-items: center; background: var(--card); padding: 10px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .track-card:hover { background: #282828; border-left: 4px solid var(--spotify-green); }
        .track-card img { width: 50px; height: 50px; margin-right: 15px; border-radius: 4px; }
        .track-info b { display: block; font-size: 14px; }
        .track-info span { font-size: 12px; color: #b3b3b3; }
        .btn-login { background: var(--spotify-green); color: black; padding: 15px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; width: 100%; }
        #status-bar { font-size: 12px; color: var(--spotify-green); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <h2>🎵 Jukebox do Bar</h2>
        <p>Conecta o Spotify do balcão para ativar o player.</p>
        <button class="btn-login" onclick="loginSpotify()">ENTRAR COM SPOTIFY</button>
    </div>

    <div id="app-section" style="display:none;">
        <div id="status-bar">● Ligado ao som do bar</div>
        <input type="text" class="search-box" id="query" placeholder="Pesquisar música..." oninput="buscar()">
        <div id="results"></div>
    </div>
</div>

<script>
    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const CLIENT_SECRET = '8bc683ac2c3d4c9ba31041a857b62537'; // <-- NOVO
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';

    // Lógica para capturar o código ou o token
    const urlParams = new URLSearchParams(window.location.search);
    let code = urlParams.get('code');
    let token = localStorage.getItem('spotify_token');

    if (code) {
        // Se temos um código, vamos trocá-lo por um token
        trocarCodigoPorToken(code);
    }

    if (token) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
    }

    function loginSpotify() {
        const scopes = 'user-modify-playback-state user-read-playback-state streaming';
        // MUDANÇA AQUI: response_type agora é CODE
        const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}&show_dialog=true`;
        window.location.href = authUrl;
    }

    async function trocarCodigoPorToken(code) {
        const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
            },
            body: new URLSearchParams({
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI
            })
        });
        const data = await res.json();
        if (data.access_token) {
            localStorage.setItem('spotify_token', data.access_token);
            window.location.href = REDIRECT_URI; // Limpa o código do URL
        }
    }

    async function buscar() {
        const q = document.getElementById('query').value;
        if (q.length < 3) return;
        const currentToken = localStorage.getItem('spotify_token');

        const res = await fetch(`https://api.spotify.com/v1/search?q=${q}&type=track&limit=5`, {
            headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const data = await res.json();
        
        let html = '';
        data.tracks.items.forEach(track => {
            html += `
                <div class="track-card" onclick="adicionarFila('${track.uri}', '${track.name}')">
                    <img src="${track.album.images[0].url}">
                    <div class="track-info">
                        <b>${track.name}</b>
                        <span>${track.artists[0].name}</span>
                    </div>
                </div>`;
        });
        document.getElementById('results').innerHTML = html;
    }

    async function adicionarFila(uri, nome) {
        const currentToken = localStorage.getItem('spotify_token');
        const res = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${uri}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${currentToken}` }
        });

        if (res.ok) {
            alert(`✅ "${nome}" na fila!`);
        } else {
            alert('Erro: Abre o Spotify no bar primeiro!');
        }
    }
</script>
</body>
</html>
