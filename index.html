<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - Jukebox</title>
    <style>
        :root { --neon-red: #FF0000; --dark-bg: #0a0a0a; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; }
        .header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--neon-red); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; font-size: 1.5rem; }
        .now-playing { background: #111; margin: 20px; padding: 20px; border-radius: 20px; border: 1px solid var(--neon-red); }
        .album-art { width: 80px; height: 80px; border-radius: 10px; margin-bottom: 10px; }
        .btn-staff { background: var(--neon-red); border: none; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 50px; }
        #admin-panel { display: none; justify-content: center; gap: 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="login-section" style="display:none;">
        <h1 class="logo" style="margin-top:100px; font-size: 3rem;">Portinha</h1>
        <button class="btn-staff" onclick="window.loginSpotify()">LOGIN STAFF (SPOTIFY)</button>
    </div>

    <div id="app-section">
        <div class="header">
            <span class="logo">Portinha</span>
            <span id="badge" style="border: 1px solid #444; padding: 3px 10px; border-radius: 5px; font-size: 0.7rem;">CLIENTE</span>
        </div>

        <div class="now-playing">
            <img src="" id="current-art" class="album-art" onerror="this.src='https://firebasestorage.googleapis.com/v0/b/jukebox-17937.appspot.com/o/default_album.png?alt=media&token=866085a8-20d0-4822-a9b0-95123d91341c'">
            <b id="current-name" style="display:block;">A ligar ao bar...</b>
            <span id="current-artist" style="color: gray;">Taproom</span>
            
            <div id="admin-panel">
                <button onclick="window.spotifyControl('previous')" style="background:none; border:none; color:white; font-size:1.5rem;">⏮</button>
                <button class="btn-staff" style="margin-top:0; padding:10px 20px;" onclick="window.spotifyControl('play')">▶/II</button>
                <button onclick="window.spotifyControl('next')" style="background:none; border:none; color:white; font-size:1.5rem;">⏭</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAkdaAdfLHSVsWD5bsoLIsBZwsRTOpCOEg",
        authDomain: "portinha-jukebox.firebaseapp.com",
        databaseURL: "https://portinha-jukebox-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "portinha-jukebox",
        storageBucket: "portinha-jukebox.firebasestorage.app",
        messagingSenderId: "618341176151",
        appId: "1:618341176151:web:b5aa655b9b7496ca2fa412"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const CLIENT_SECRET = '8bc683ac2c3d4c9ba31041a857b62537';
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbze6WhezvXrZwKzJKbrl98ONvWBySpEIKvOFA0PoJfGtiPySfEluPQq_i5mTRSa1nCNuw/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    let accessToken = "";

    window.loginSpotify = () => {
        const scopes = 'user-modify-playback-state user-read-playback-state user-read-currently-playing';
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}&show_dialog=true`;
    };

    const code = urlParams.get('code');
    if (isAdmin && code) {
        // ENVIANDO COMO FORM DATA PARA EVITAR O ERRO DE CORB
        const formData = new URLSearchParams();
        formData.append('grant_type', 'authorization_code');
        formData.append('code', code);
        formData.append('redirect_uri', REDIRECT_URI);
        formData.append('client_id', CLIENT_ID);
        formData.append('client_secret', CLIENT_SECRET);

        fetch(PROXY_URL, {
            method: 'POST',
            body: formData.toString(), // Texto puro, evita pre-flight do browser
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        })
        .then(res => res.json())
        .then(async data => {
            if (data.access_token) {
                await set(ref(db, 'auth'), data);
                window.location.href = REDIRECT_URI + '?admin=true';
            }
        });
    }

    onValue(ref(db, 'auth/access_token'), (snap) => {
        accessToken = snap.val();
        if (accessToken) {
            if (isAdmin) document.getElementById('admin-panel').style.display = 'flex';
            setInterval(updatePlayer, 3000);
            updatePlayer();
        } else if (isAdmin && !code) {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    });

    async function updatePlayer() {
        if (!accessToken) return;
        try {
            const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (res.status === 200) {
                const data = await res.json();
                document.getElementById('current-art').src = data.item.album.images[0].url;
                document.getElementById('current-name').innerText = data.item.name;
                document.getElementById('current-artist').innerText = data.item.artists[0].name;
            }
        } catch (e) {}
    }

    window.spotifyControl = async (act) => {
        fetch(`https://api.spotify.com/v1/me/player/${act === 'play' ? 'play' : act}`, {
            method: (act === 'next' || act === 'previous') ? 'POST' : 'PUT',
            headers: { 'Authorization': 'Bearer ' + accessToken }
        });
    };
</script>
</body>
</html>
