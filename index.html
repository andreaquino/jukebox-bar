<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Jukebox 2026</title>
    <style>
        :root { --spotify-green: #1DB954; --dark: #121212; --card: #181818; }
        body { background-color: var(--dark); color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; }
        .search-box { width: 100%; padding: 15px; border-radius: 30px; border: none; background: #282828; color: white; margin-bottom: 20px; }
        .track-card { display: flex; align-items: center; background: var(--card); padding: 10px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; text-align: left; }
        .track-card img { width: 50px; height: 50px; margin-right: 15px; border-radius: 4px; }
        .btn-login { background: var(--spotify-green); color: black; padding: 15px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <h2>🎵 Jukebox do Bar</h2>
        <button class="btn-login" onclick="loginSpotify()">ENTRAR COM SPOTIFY</button>
    </div>

    <div id="app-section" style="display:none;">
        <input type="text" class="search-box" id="query" placeholder="Pesquisar música..." oninput="buscar()">
        <div id="results"></div>
    </div>
</div>

<script>
    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const CLIENT_SECRET = '8bc683ac2c3d4c9ba31041a857b62537'; // <-- Pega no Dashboard do Spotify!
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';

    // Verifica se voltámos do Spotify com um código ou se já temos um token salvo
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    let accessToken = localStorage.getItem('spotify_access_token');

    async function inicializar() {
        if (authCode) {
            await trocarCodigoPorToken(authCode);
        } else if (accessToken) {
            mostrarApp();
        }
    }

    function loginSpotify() {
        const scopes = 'user-modify-playback-state user-read-playback-state';
        // Aqui está a mudança: response_type=code
        const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}&show_dialog=true`;
        window.location.href = authUrl;
    }

    async function trocarCodigoPorToken(code) {
        const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
            },
            body: new URLSearchParams({
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI
            })
        });
        const data = await response.json();
        if (data.access_token) {
            localStorage.setItem('spotify_access_token', data.access_token);
            window.location.href = REDIRECT_URI; // Limpa o código do URL
        }
    }

    function mostrarApp() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
    }

    async function buscar() {
        const q = document.getElementById('query').value;
        if (q.length < 3) return;
        const res = await fetch(`https://api.spotify.com/v1/search?q=${q}&type=track&limit=5`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('spotify_access_token')}` }
        });
        const data = await res.json();
        let html = '';
        data.tracks.items.forEach(track => {
            html += `<div class="track-card" onclick="pedir('${track.uri}', '${track.name}')">
                <img src="${track.album.images[0].url}">
                <div><b>${track.name}</b><br><span>${track.artists[0].name}</span></div>
            </div>`;
        });
        document.getElementById('results').innerHTML = html;
    }

    async function pedir(uri, nome) {
        const res = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${uri}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('spotify_access_token')}` }
        });
        if (res.ok) alert(`✅ "${nome}" na fila!`);
        else alert('Erro: Garante que o Spotify está a tocar no bar!');
    }

    inicializar();
</script>
</body>
</html>
