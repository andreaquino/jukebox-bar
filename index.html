<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Jukebox - TV & Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { neonPink: '#ff00ff', neonCyan: '#00ffff', darkBg: '#0b0c10', darkCard: '#1f2833' } } }
        }
    </script>
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .neon-text-pink { text-shadow: 0 0 10px #ff00ff; color: #fff; }
        .neon-border-cyan { box-shadow: 0 0 15px #00ffff; border: 1px solid #00ffff; }
        .progress-anim { width: 0%; transition: width 1s linear; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-4xl flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-4xl font-black neon-text-pink tracking-tighter italic">NEON BAR</h1>
            <p class="text-xs text-neonCyan tracking-widest uppercase">Jukebox Comunitária</p>
        </div>
        <button id="modeToggle" onclick="toggleMode()" class="px-6 py-2 rounded-full border border-pink-500 text-pink-500 text-xs font-bold hover:bg-pink-500 hover:text-white transition-all">
            ADMIN / TV
        </button>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="md:col-span-2 flex flex-col gap-6">
            
            <section class="bg-darkCard rounded-3xl p-8 neon-border-cyan relative overflow-hidden">
                <div class="flex gap-6 items-center">
                    <img id="np-cover" src="https://via.placeholder.com/300?text=Neon+Bar" class="w-32 h-32 md:w-48 md:h-48 rounded-2xl shadow-2xl">
                    <div class="flex-1">
                        <span class="text-neonCyan text-xs font-bold uppercase tracking-widest">A tocar agora</span>
                        <h3 id="np-title" class="text-3xl md:text-5xl font-bold text-white leading-none mt-2">Pronto para a festa?</h3>
                        <p id="np-artist" class="text-xl text-gray-400 mt-2">Escolha uma música abaixo</p>
                        <p id="np-suggester" class="text-sm text-pink-500 mt-4 font-mono"></p>
                    </div>
                </div>
                <div class="w-full bg-gray-900 h-3 rounded-full mt-8">
                    <div id="progress-bar" class="bg-neonPink h-full rounded-full shadow-[0_0_10px_#ff00ff] progress-anim"></div>
                </div>
                
                <div id="admin-controls" class="hidden mt-6 justify-end gap-4">
                    <button onclick="skipSong()" class="bg-white text-black px-6 py-2 rounded-full font-bold flex items-center gap-2 hover:bg-neonCyan transition-all">
                        <i data-lucide="skip-forward" class="w-4 h-4"></i> PRÓXIMA DA FILA
                    </button>
                </div>
            </section>

            <section id="search-section" class="bg-gray-900/50 rounded-3xl p-6 border border-gray-800">
                <div class="flex gap-3 mb-4">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchRealMusic()" placeholder="Qual música quer ouvir?" class="flex-1 bg-black border border-gray-700 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-neonPink transition-all">
                    <button onclick="searchRealMusic()" class="bg-neonPink text-white font-bold px-8 rounded-2xl hover:scale-105 transition-transform">BUSCAR</button>
                </div>
                <div id="search-results" class="grid grid-cols-1 gap-2 max-h-80 overflow-y-auto"></div>
            </section>
        </div>

        <div class="md:col-span-1">
            <div class="sticky top-4">
                <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                    <i data-lucide="list-music" class="text-neonPink"></i> FILA DE ESPERA
                </h2>
                <div id="queue-list" class="flex flex-col gap-4">
                    </div>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURAÇÕES
        const supabaseUrl = 'https://tgbyxogyrugjfggugigf.supabase.co';
        const supabaseKey = 'sb_publishable_MJFbecAQa8GZ4LdNb5ruew_9N9bg2ro';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const spotifyClientId = '3351b90e625048618d7f976a4f4b5a5a';
        const spotifyClientSecret = '8bc683ac2c3d4c9ba31041a857b62537';
        let spotifyToken = '';

        // GERAR IDENTIDADE DO DISPOSITIVO (FINGERPRINT)
        if (!localStorage.getItem('jukebox_user_id')) {
            localStorage.setItem('jukebox_user_id', 'user_' + Math.random().toString(36).substr(2, 9));
        }
        const MY_ID = localStorage.getItem('jukebox_user_id');

        let isAdmin = false;
        let queue = [];
        let progress = 0;

        async function getSpotifyToken() {
            const res = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(spotifyClientId + ':' + spotifyClientSecret) },
                body: 'grant_type=client_credentials'
            });
            const data = await res.json();
            spotifyToken = data.access_token;
        }

        async function searchRealMusic() {
            const input = document.getElementById('searchInput').value;
            if (!input) return;
            const container = document.getElementById('search-results');
            container.innerHTML = '<p class="p-4 animate-pulse text-neonCyan">A consultar Spotify...</p>';
            container.classList.remove('hidden');

            try {
                if (!spotifyToken) await getSpotifyToken();
                const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(input)}&type=track&limit=6`, {
                    headers: { 'Authorization': 'Bearer ' + spotifyToken }
                });
                const data = await res.json();
                container.innerHTML = '';

                data.tracks.items.forEach(song => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-4 bg-black/40 p-3 rounded-2xl border border-gray-800 hover:border-neonPink transition-all cursor-pointer group";
                    div.onclick = () => prepareAdd(song.name, song.artists[0].name, song.album.images[0].url);
                    div.innerHTML = `
                        <img src="${song.album.images[2].url}" class="w-12 h-12 rounded-lg">
                        <div class="flex-1 overflow-hidden">
                            <p class="text-white font-bold truncate">${song.name}</p>
                            <p class="text-xs text-gray-500">${song.artists[0].name}</p>
                        </div>
                        <i data-lucide="plus" class="text-gray-600 group-hover:text-neonPink"></i>
                    `;
                    container.appendChild(div);
                });
                lucide.createIcons();
            } catch (e) { container.innerHTML = '<p class="text-red-500">Erro na busca.</p>'; }
        }

        async function prepareAdd(title, artist, cover) {
            // ANTI-SPAM: Verificar quantas músicas este user já tem na fila
            const { data: mySongs } = await supabaseClient
                .from('queue')
                .select('id')
                .eq('user_id', MY_ID)
                .eq('status', 'pending');

            if (mySongs && mySongs.length >= 3) {
                alert("Calma! Já tens 3 músicas na fila. Espera que toquem para pedires mais.");
                return;
            }

            const name = prompt("Qual é o teu nome? (Opcional)", localStorage.getItem('user_display_name') || "");
            if (name !== null) {
                localStorage.setItem('user_display_name', name);
                addToQueueReal(title, artist, cover, name || "Anónimo");
            }
        }

        async function addToQueueReal(title, artist, coverUrl, userName) {
            const { error } = await supabaseClient.from('queue').insert([{ 
                title, artist, cover_url: coverUrl, user_name: userName, user_id: MY_ID, status: 'pending', votes: 0 
            }]);
            if (error) alert("Erro: " + error.message);
            document.getElementById('search-results').classList.add('hidden');
            document.getElementById('searchInput').value = '';
        }

        async function fetchQueue() {
            const { data } = await supabaseClient.from('queue').select('*').eq('status', 'pending').order('votes', { ascending: false });
            queue = data || [];
            renderQueue();
        }

        function renderQueue() {
            const container = document.getElementById('queue-list');
            container.innerHTML = '';
            queue.forEach(song => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 bg-gray-900/80 p-4 rounded-2xl border border-gray-800 animate-in fade-in slide-in-from-right-4 duration-500";
                div.innerHTML = `
                    <div class="relative">
                        <img src="${song.cover_url}" class="w-14 h-14 rounded-xl shadow-lg">
                        <span class="absolute -top-2 -left-2 bg-neonPink text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${song.votes}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-bold truncate">${song.title}</p>
                        <p class="text-[10px] text-gray-500 uppercase tracking-tighter">Sugestão: <span class="text-neonCyan">${song.user_name}</span></p>
                    </div>
                    <button onclick="upvote('${song.id}')" class="p-3 bg-gray-800 rounded-xl hover:bg-neonPink transition-colors">
                        <i data-lucide="heart" class="w-5 h-5 text-white"></i>
                    </button>
                    ${isAdmin ? `<button onclick="removeSong('${song.id}')" class="text-red-500 p-2"><i data-lucide="trash-2"></i></button>` : ''}
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        async function upvote(id) {
            const song = queue.find(s => s.id === id);
            await supabaseClient.from('queue').update({ votes: (song.votes || 0) + 1 }).eq('id', id);
        }

        async function skipSong() {
            if (queue.length > 0) {
                const next = queue[0];
                document.getElementById('np-title').innerText = next.title;
                document.getElementById('np-artist').innerText = next.artist;
                document.getElementById('np-cover').src = next.cover_url;
                document.getElementById('np-suggester').innerText = "Sugerido por: " + next.user_name;
                progress = 0;
                await supabaseClient.from('queue').update({ status: 'played' }).eq('id', next.id);
            }
        }

        async function removeSong(id) { await supabaseClient.from('queue').delete().eq('id', id); }

        function toggleMode() {
            isAdmin = !isAdmin;
            document.getElementById('admin-controls').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-controls').classList.toggle('flex', isAdmin);
            document.getElementById('search-section').classList.toggle('hidden', isAdmin);
            fetchQueue();
        }

        // REALTIME
        supabaseClient.channel('queue_realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, () => fetchQueue()).subscribe();

        setInterval(() => { if (progress < 100) { progress += 0.5; document.getElementById('progress-bar').style.width = progress + '%'; } }, 1000);

        fetchQueue();
        lucide.createIcons();
    </script>
</body>
</html>
