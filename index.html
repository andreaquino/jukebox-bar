<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - Jukebox</title>
    <style>
        :root { --neon-red: #FF0000; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; --text-gray: #a0a0a0; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 100px; }
        .header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--neon-red); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; font-size: 1.5rem; }
        .now-playing { background: linear-gradient(145deg, #222, #111); margin: 20px; padding: 20px; border-radius: 20px; border: 1px solid var(--neon-red); box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); }
        .player-main { display: flex; align-items: center; margin-bottom: 15px; }
        .album-art-container { width: 65px; height: 65px; border-radius: 10px; margin-right: 15px; background: #333; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #444; }
        .album-art { width: 100%; height: 100%; object-fit: cover; }
        .progress-container { width: 100%; height: 4px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: var(--neon-red); transition: width 1s linear; }
        #admin-panel { display: none; justify-content: center; gap: 20px; margin-top: 15px; }
        .btn-play { background: var(--neon-red); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        .search-container { padding: 0 20px; }
        .search-box { width: 100%; padding: 15px; background: #222; border: 1px solid #333; border-radius: 50px; color: white; outline: none; box-sizing: border-box; }
        .track-item { display: flex; align-items: center; background: var(--card-bg); padding: 12px; margin-top: 10px; border-radius: 15px; }
        .btn-add { margin-left: auto; background: var(--neon-red); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <div id="login-section" class="login-overlay" style="display:none;">
        <h1 class="logo" style="font-size: 3rem; margin-bottom: 20px;">Portinha</h1>
        <button class="btn-add" style="padding: 15px 30px;" onclick="window.loginSpotify()">LOGIN STAFF (SPOTIFY)</button>
    </div>

    <div id="app-section">
        <div class="header">
            <a href="#" class="logo">Portinha</a>
            <span id="badge" style="font-size: 0.6rem; border: 1px solid #444; padding: 3px 8px; border-radius: 5px; color: #888;">MODO CLIENTE</span>
        </div>

        <div class="now-playing">
            <div class="player-main">
                <div class="album-art-container">
                    <img src="" class="album-art" id="current-art" onerror="this.src='https://firebasestorage.googleapis.com/v0/b/jukebox-17937.appspot.com/o/default_album.png?alt=media&token=866085a8-20d0-4822-a9b0-95123d91341c'">
                </div>
                <div class="track-info">
                    <span style="color: var(--neon-red); font-size: 0.7rem; font-weight: bold;">A TOCAR AGORA</span>
                    <b id="current-name" style="display:block; font-size: 1.1rem;">A ligar ao bar...</b>
                    <span id="current-artist" style="color:var(--text-gray); font-size:0.9rem;">Taproom</span>
                </div>
            </div>
            <div class="progress-container"><div id="progress" class="progress-bar"></div></div>
            <div id="admin-panel">
                <button onclick="window.spotifyControl('previous')" style="background:none; border:none; color:white; font-size:1.5rem;">⏮</button>
                <button class="btn-play" onclick="window.spotifyControl('play')">▶</button>
                <button class="btn-play" style="background:#333;" onclick="window.spotifyControl('pause')">II</button>
                <button onclick="window.spotifyControl('next')" style="background:none; border:none; color:white; font-size:1.5rem;">⏭</button>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" id="query" placeholder="Pedir uma música..." oninput="window.buscar()">
            <div id="results"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAkdaAdfLHSVsWD5bsoLIsBZwsRTOpCOEg",
        authDomain: "portinha-jukebox.firebaseapp.com",
        databaseURL: "https://portinha-jukebox-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "portinha-jukebox",
        storageBucket: "portinha-jukebox.firebasestorage.app",
        messagingSenderId: "618341176151",
        appId: "1:618341176151:web:b5aa655b9b7496ca2fa412",
        measurementId: "G-7KLTQ54PRV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    let accessToken = "";

    // Tornar funções globais para o HTML as ver
    window.loginSpotify = () => {
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=user-modify-playback-state user-read-playback-state user-read-currently-playing`;
    };

    async function updatePlayer() {
        if (!accessToken) return;
        try {
            const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (res.status === 200) {
                const data = await res.json();
                document.getElementById('current-art').src = data.item.album.images[0].url;
                document.getElementById('current-name').innerText = data.item.name;
                document.getElementById('current-artist').innerText = data.item.artists[0].name;
                document.getElementById('progress').style.width = (data.progress_ms / data.item.duration_ms * 100) + '%';
            } else if (res.status === 204) {
                document.getElementById('current-name').innerText = "Spotify em pausa";
            }
        } catch (e) { console.error("Erro player", e); }
    }

    window.spotifyControl = async (endpoint) => {
        const method = (endpoint === 'next' || endpoint === 'previous') ? 'POST' : 'PUT';
        await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, { 
            method: method, 
            headers: { 'Authorization': `Bearer ${accessToken}` } 
        });
        setTimeout(updatePlayer, 500);
    };

    window.buscar = async () => {
        const q = document.getElementById('query').value;
        if (q.length < 3) return;
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=5`, {
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        let html = '';
        data.tracks.items.forEach(t => {
            html += `<div class="track-item">
                <img src="${t.album.images[0].url}" style="width:40px; border-radius:5px; margin-right:15px;">
                <div style="flex:1"><b>${t.name}</b><br><small>${t.artists[0].name}</small></div>
                <button class="btn-add" onclick="window.enqueue('${t.uri}')">PEDIR</button>
            </div>`;
        });
        document.getElementById('results').innerHTML = html;
    };

    window.enqueue = async (uri) => {
        const res = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${uri}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (res.ok) alert("Música adicionada à fila!");
    };

    // Inicialização
    const code = urlParams.get('code');
    if (isAdmin && code) {
        const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://accounts.spotify.com/api/token'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(CLIENT_ID + ':8bc683ac2c3d4c9ba31041a857b62537') },
            body: new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT_URI })
        });
        const data = await res.json();
        if (data.access_token) {
            await set(ref(db, 'auth'), data);
            window.location.href = REDIRECT_URI + '?admin=true';
        }
    } else {
        onValue(ref(db, 'auth/access_token'), (snapshot) => {
            accessToken = snapshot.val();
            if (accessToken) {
                if (isAdmin) {
                    document.getElementById('admin-panel').style.display = 'flex';
                    document.getElementById('badge').innerText = "STAFF";
                    document.getElementById('badge').style.color = "red";
                }
                updatePlayer();
                setInterval(updatePlayer, 3000);
            } else if (isAdmin) {
                document.getElementById('login-section').style.display = 'flex';
                document.getElementById('app-section').style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
