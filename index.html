<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; }
        .logo { color: red; font-weight: 900; font-size: 2rem; margin: 20px; }
        .card { border: 1px solid red; margin: 20px; padding: 20px; border-radius: 15px; background: #111; }
        img { width: 150px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
        .btn { background: red; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="logo">PORTINHA</div>
    
    <div id="login-zone" style="display:none;">
        <button class="btn" onclick="login()">LOGIN STAFF</button>
    </div>

    <div class="card">
        <img id="art" src="">
        <h2 id="track">Carregando...</h2>
        <p id="artist">Aguarde o staff iniciar...</p>
    </div>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbze6WhezvXrZwKzJKbrl98ONvWBySpEIKvOFA0PoJfGtiPySfEluPQq_i5mTRSa1nCNuw/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'true';

        function login() {
            const scope = 'user-read-currently-playing user-modify-playback-state';
            const spotifyAuth = `https://accounts.spotify.com/authorize?client_id=3351b90e625048618d7f976a4f4b5a5a&response_type=code&redirect_uri=${encodeURIComponent(GOOGLE_URL)}&scope=${encodeURIComponent(scope)}`;
            window.location.href = spotifyAuth;
        }

        async function update() {
            try {
                // Pedimos à Google (Ponte), não ao Spotify. Zero CORB!
                const r = await fetch(GOOGLE_URL + "?action=get_player");
                const d = await r.json();
                
                if (d && d.item) {
                    document.getElementById('art').src = d.item.album.images[0].url;
                    document.getElementById('track').innerText = d.item.name;
                    document.getElementById('artist').innerText = d.item.artists[0].name;
                }
            } catch (e) {
                console.log("Ainda sem música...");
            }
        }

        if (isAdmin) {
            // Se não houver música, mostra o botão de login
            setTimeout(() => {
                if (document.getElementById('track').innerText === "Carregando...") {
                    document.getElementById('login-zone').style.display = 'block';
                }
            }, 3000);
        }

        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
