<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - Jukebox</title>
    <style>
        :root { --neon-red: #FF0000; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 100px; text-align: center; }
        .header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--neon-red); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; font-size: 1.5rem; }
        .now-playing { background: linear-gradient(145deg, #222, #111); margin: 20px; padding: 20px; border-radius: 20px; border: 1px solid var(--neon-red); }
        .album-art-container { width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 10px; overflow: hidden; background: #333; border: 1px solid #444; }
        .album-art { width: 100%; height: 100%; object-fit: cover; }
        .progress-container { width: 100%; height: 4px; background: #333; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--neon-red); transition: width 1s linear; }
        #admin-panel { display: none; justify-content: center; gap: 20px; margin-top: 20px; }
        .btn { background: var(--neon-red); border: none; color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .search-box { width: 80%; padding: 15px; background: #222; border: 1px solid #333; border-radius: 50px; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="login-section" style="display:none; padding-top: 100px;">
        <h1 class="logo" style="font-size: 3rem;">Portinha</h1>
        <button class="btn" onclick="window.loginSpotify()">ATIVAR JUKEBOX (STAFF)</button>
    </div>

    <div id="app-section">
        <div class="header">
            <span class="logo">Portinha</span>
            <span id="badge" style="border: 1px solid #444; padding: 3px 10px; border-radius: 5px; font-size: 0.7rem;">CLIENTE</span>
        </div>

        <div class="now-playing">
            <div class="album-art-container">
                <img src="" id="current-art" class="album-art" onerror="this.src='https://firebasestorage.googleapis.com/v0/b/jukebox-17937.appspot.com/o/default_album.png?alt=media&token=866085a8-20d0-4822-a9b0-95123d91341c'">
            </div>
            <b id="current-name" style="display:block; font-size: 1.2rem;">Carregando...</b>
            <span id="current-artist" style="color: gray;">Aguarde</span>
            
            <div class="progress-container"><div id="progress" class="progress-bar"></div></div>

            <div id="admin-panel">
                <button class="btn" onclick="window.spotifyControl('previous')">⏮</button>
                <button class="btn" onclick="window.spotifyControl('play')">▶/II</button>
                <button class="btn" onclick="window.spotifyControl('next')">⏭</button>
            </div>
        </div>

        <input type="text" class="search-box" id="query" placeholder="Pesquisar música..." oninput="window.buscar()">
        <div id="results" style="padding: 20px;"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    // Credenciais que enviaste
    const firebaseConfig = {
        apiKey: "AIzaSyAkdaAdfLHSVsWD5bsoLIsBZwsRTOpCOEg",
        authDomain: "portinha-jukebox.firebaseapp.com",
        databaseURL: "https://portinha-jukebox-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "portinha-jukebox",
        storageBucket: "portinha-jukebox.firebasestorage.app",
        messagingSenderId: "618341176151",
        appId: "1:618341176151:web:b5aa655b9b7496ca2fa412"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const CLIENT_SECRET = '8bc683ac2c3d4c9ba31041a857b62537';
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';
    
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    let accessToken = "";

    window.loginSpotify = () => {
        const scopes = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}&show_dialog=true`;
    };

    // TROCA DO TOKEN (CORREÇÃO DO CORB)
    const code = urlParams.get('code');
    if (isAdmin && code) {
        const authOptions = {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
            },
            body: new URLSearchParams({
                code: code,
                redirect_uri: REDIRECT_URI,
                grant_type: 'authorization_code'
            })
        };

        // Usando o AllOrigins que é mais permissivo com CORB
        fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://accounts.spotify.com/api/token')}&timestamp=${Date.now()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI,
                client_id: CLIENT_ID,
                client_secret: CLIENT_SECRET
            })
        })
        .then(res => res.json())
        .then(async data => {
            const parsed = JSON.parse(data.contents);
            if (parsed.access_token) {
                await set(ref(db, 'auth'), parsed);
                window.location.href = REDIRECT_URI + '?admin=true';
            }
        });
    }

    // LISTENER DO TOKEN
    onValue(ref(db, 'auth/access_token'), (snap) => {
        accessToken = snap.val();
        if (accessToken) {
            if (isAdmin) {
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('badge').innerText = "STAFF";
                document.getElementById('badge').style.color = "red";
            }
            setInterval(updatePlayer, 3000);
            updatePlayer();
        } else if (isAdmin) {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    });

    async function updatePlayer() {
        try {
            const res = await fetch('https://api.spotify.com/v1/me/player', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (res.status === 200) {
                const data = await res.json();
                document.getElementById('current-art').src = data.item.album.images[0].url;
                document.getElementById('current-name').innerText = data.item.name;
                document.getElementById('current-artist').innerText = data.item.artists[0].name;
                document.getElementById('progress').style.width = (data.progress_ms / data.item.duration_ms * 100) + '%';
            }
        } catch (e) {}
    }

    window.spotifyControl = async (action) => {
        const url = action === 'play' ? 'https://api.spotify.com/v1/me/player/play' : 
                    action === 'pause' ? 'https://api.spotify.com/v1/me/player/pause' :
                    `https://api.spotify.com/v1/me/player/${action}`;
        
        fetch(url, {
            method: (action === 'next' || action === 'previous') ? 'POST' : 'PUT',
            headers: { 'Authorization': 'Bearer ' + accessToken }
        });
    };
</script>
</body>
</html>
