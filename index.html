<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - Jukebox</title>
    <style>
        :root { --neon-red: #FF0000; --dark-bg: #0a0a0a; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; }
        .logo { color: var(--neon-red); font-weight: 900; text-transform: uppercase; font-size: 1.5rem; letter-spacing: 2px; }
        .btn-staff { background: var(--neon-red); border: none; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .now-playing { border: 1px solid var(--neon-red); margin: 20px; padding: 20px; border-radius: 20px; background: #111; }
    </style>
</head>
<body>

    <div id="login-section" style="display:none; padding-top: 100px;">
        <h1 class="logo" style="font-size: 3rem;">Portinha</h1>
        <button class="btn-staff" onclick="window.loginSpotify()">LOGIN STAFF (SPOTIFY)</button>
    </div>

    <div id="app-section">
        <div style="padding:20px; display:flex; justify-content:space-between; align-items:center;">
            <span class="logo">Portinha</span>
            <span id="badge" style="border:1px solid #444; padding:5px 10px; border-radius:5px; font-size:0.7rem;">CLIENTE</span>
        </div>

        <div class="now-playing">
            <img src="" id="current-art" style="width:80px; border-radius:10px; margin-bottom:10px;" onerror="this.src='https://firebasestorage.googleapis.com/v0/b/jukebox-17937.appspot.com/o/default_album.png?alt=media&token=866085a8-20d0-4822-a9b0-95123d91341c'">
            <b id="current-name" style="display:block; font-size:1.2rem;">Jukebox Offline</b>
            <span id="current-artist" style="color: gray;">À espera do staff...</span>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAkdaAdfLHSVsWD5bsoLIsBZwsRTOpCOEg",
        authDomain: "portinha-jukebox.firebaseapp.com",
        databaseURL: "https://portinha-jukebox-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "portinha-jukebox",
        storageBucket: "portinha-jukebox.firebasestorage.app",
        appId: "1:618341176151:web:b5aa655b9b7496ca2fa412"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbze6WhezvXrZwKzJKbrl98ONvWBySpEIKvOFA0PoJfGtiPySfEluPQq_i5mTRSa1nCNuw/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    const code = urlParams.get('code');

    window.loginSpotify = () => {
        const scopes = 'user-modify-playback-state user-read-playback-state user-read-currently-playing';
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}`;
    };

    // MODO ADMIN: Envia o código para a ponte e deixa a ponte escrever no Firebase
    if (isAdmin && code) {
        fetch(PROXY_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI,
                client_id: CLIENT_ID,
                client_secret: '8bc683ac2c3d4c9ba31041a857b62537'
            })
        });
        setTimeout(() => window.location.href = REDIRECT_URI + '?admin=true', 2500);
    }

    // LISTENER: O site apenas "ouve" o Firebase. Isto nunca dá erro de CORB!
    onValue(ref(db, 'auth/access_token'), (snap) => {
        const token = snap.val();
        if (token) {
            if (isAdmin) document.getElementById('badge').innerText = "STAFF";
            updatePlayer(token);
            setInterval(() => updatePlayer(token), 3000);
        } else if (isAdmin && !code) {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    });

    async function updatePlayer(t) {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': 'Bearer ' + t }
        });
        if (res.status === 200) {
            const data = await res.json();
            document.getElementById('current-art').src = data.item.album.images[0].url;
            document.getElementById('current-name').innerText = data.item.name;
            document.getElementById('current-artist').innerText = data.item.artists[0].name;
        }
    }
</script>
</body>
</html>
