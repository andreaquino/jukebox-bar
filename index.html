<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - Jukebox</title>
    <style>
        :root { --neon-red: #FF0000; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; --text-gray: #a0a0a0; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 100px; }
        .header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--neon-red); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        .now-playing { background: linear-gradient(145deg, #222, #111); margin: 20px; padding: 20px; border-radius: 20px; border: 1px solid var(--neon-red); box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); }
        .player-main { display: flex; align-items: center; margin-bottom: 15px; }
        .album-art { width: 65px; height: 65px; border-radius: 10px; margin-right: 15px; background: #333; object-fit: cover; }
        .progress-container { width: 100%; height: 4px; background: #333; border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--neon-red); transition: width 1s linear; }
        #admin-panel { display: none; justify-content: center; gap: 20px; margin-top: 15px; }
        .btn-play { background: var(--neon-red); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        .search-container { padding: 0 20px; }
        .search-box { width: 100%; padding: 15px 20px; background: #222; border: 1px solid #333; border-radius: 50px; color: white; outline: none; box-sizing: border-box; }
        .track-item { display: flex; align-items: center; background: var(--card-bg); padding: 10px; margin-bottom: 10px; border-radius: 15px; }
        .btn-add { margin-left: auto; background: var(--neon-red); color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <div id="login-section" class="login-overlay" style="display:none;">
        <h1 class="logo">Portinha</h1>
        <p style="color:gray">Painel de Controlo do Bar</p>
        <button class="btn-add" style="margin-top:20px;" onclick="loginSpotify()">AUTORIZAR SPOTIFY</button>
    </div>

    <div id="app-section">
        <div class="header">
            <h2 class="logo">Portinha</h2>
            <span id="badge" style="font-size:0.6rem; border:1px solid #333; padding:2px 5px; border-radius:4px; color:#555;">MODO CLIENTE</span>
        </div>

        <div class="now-playing">
            <div class="player-main">
                <img src="" class="album-art" id="current-art">
                <div class="track-info">
                    <b id="current-name">A ligar ao bar...</b><br>
                    <span id="current-artist" style="color:var(--text-gray); font-size:0.8rem;">Taproom</span>
                </div>
            </div>
            <div class="progress-container"><div id="progress" class="progress-bar"></div></div>
            <div id="admin-panel">
                <button onclick="spotifyControl('previous')" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">⏮</button>
                <button class="btn-play" onclick="spotifyControl('play')">▶</button>
                <button class="btn-play" style="background:#333;" onclick="spotifyControl('pause')">II</button>
                <button onclick="spotifyControl('next')" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">⏭</button>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" id="query" placeholder="Pedir uma música..." oninput="buscar()">
            <div id="results" style="margin-top:15px;"></div>
        </div>
    </div>

<script>
    const FIREBASE_URL = 'https://portinha-jukebox-default-rtdb.europe-west1.firebasedatabase.app';
    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const CLIENT_SECRET = '8bc683ac2c3d4c9ba31041a857b62537';
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    let accessToken = "";
    let lastRequestTime = 0;

    async function init() {
        const code = urlParams.get('code');
        
        if (isAdmin && code) {
            // Se for admin a voltar do login, troca o código e guarda no Firebase
            await exchangeAndSaveToken(code);
        } else {
            // Se for cliente ou admin sem código no URL, carrega do Firebase
            await loadToken();
        }

        if (accessToken) {
            if (isAdmin) {
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('badge').innerText = "MODO STAFF";
                document.getElementById('badge').style.color = "red";
                document.getElementById('badge').style.borderColor = "red";
            }
            updatePlayer();
            setInterval(updatePlayer, 3000);
        } else if (isAdmin) {
            document.getElementById('login-section').style.display = 'flex';
        } else {
            document.getElementById('current-name').innerText = "Jukebox Offline";
            document.getElementById('current-artist').innerText = "O staff precisa de iniciar sessão.";
        }
    }

    async function loadToken() {
        try {
            const res = await fetch(`${FIREBASE_URL}/token.json`);
            accessToken = await res.json();
        } catch(e) { console.error("Erro ao carregar token"); }
    }

    async function exchangeAndSaveToken(code) {
        const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET) },
            body: new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT_URI })
        });
        const data = await res.json();
        if (data.access_token) {
            accessToken = data.access_token;
            await fetch(`${FIREBASE_URL}/token.json`, { method: 'PUT', body: JSON.stringify(accessToken) });
            window.location.href = REDIRECT_URI + '?admin=true';
        }
    }

    async function updatePlayer() {
        try {
            const res = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': `Bearer ${accessToken}` } });
            if (res.status === 200) {
                const data = await res.json();
                document.getElementById('current-art').src = data.item.album.images[0].url;
                document.getElementById('current-name').innerText = data.item.name;
                document.getElementById('current-artist').innerText = data.item.artists[0].name;
                document.getElementById('progress').style.width = (data.progress_ms / data.item.duration_ms * 100) + '%';
            }
        } catch (e) { console.log("Spotify pausado ou offline"); }
    }

    function loginSpotify() {
        const scopes = 'user-modify-playback-state user-read-playback-state user-read-currently-playing';
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}`;
    }

    async function spotifyControl(action) {
        const method = (action === 'next' || action === 'previous') ? 'POST' : 'PUT';
        await fetch(`https://api.spotify.com/v1/me/player/${action}`, { method: method, headers: { 'Authorization': `Bearer ${accessToken}` } });
        setTimeout(updatePlayer, 500);
    }

    async function buscar() {
        const q = document.getElementById('query').value;
        if (q.length < 3) return;
        const res = await fetch(`https://api.spotify.com/v1/search?q=${q}&type=track&limit=6`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
        const data = await res.json();
        let html = '';
        data.tracks.items.forEach(t => {
            html += `<div class="track-item">
                <img src="${t.album.images[0].url}" style="width:45px; border-radius:8px; margin-right:12px;">
                <div style="flex:1; overflow:hidden;">
                    <b style="display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${t.name}</b>
                    <span style="font-size:0.8rem; color:gray;">${t.artists[0].name}</span>
                </div>
                <button class="btn-add" onclick="enqueue('${t.uri}')">PEDIR</button>
            </div>`;
        });
        document.getElementById('results').innerHTML = html;
    }

    async function enqueue(uri) {
        const now = Date.now();
        if (now - lastRequestTime < 300000) { // 5 min de Cooldown
            alert("Espera um pouco antes de pedires outra!");
            return;
        }
        const res = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${uri}`, { method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}` } });
        if (res.ok) { lastRequestTime = now; alert("Música enviada para o Portinha!"); }
    }

    init();
</script>
</body>
</html>
