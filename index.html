<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - Jukebox</title>
    <style>
        :root { --neon-red: #FF0000; --dark-bg: #0a0a0a; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        .logo { color: var(--neon-red); font-weight: 900; text-transform: uppercase; font-size: 1.5rem; letter-spacing: 2px; }
        .btn-staff { background: var(--neon-red); border: none; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 50px; }
        .now-playing { border: 1px solid var(--neon-red); margin: 20px; padding: 20px; border-radius: 20px; background: #111; }
        #admin-controls { display: none; margin-top: 20px; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

    <div id="login-section" style="display:none;">
        <h1 class="logo" style="margin-top:100px; font-size: 3rem;">Portinha</h1>
        <button class="btn-staff" onclick="window.loginSpotify()">LOGIN STAFF (SPOTIFY)</button>
    </div>

    <div id="app-section">
        <div style="padding:20px; display:flex; justify-content:space-between;">
            <span class="logo">Portinha</span>
            <span id="badge" style="border:1px solid #444; padding:5px 10px; border-radius:5px; font-size:0.7rem;">CLIENTE</span>
        </div>
        <div class="now-playing">
            <img src="" id="current-art" style="width:100px; border-radius:10px; margin-bottom:10px;" onerror="this.src='https://firebasestorage.googleapis.com/v0/b/jukebox-17937.appspot.com/o/default_album.png?alt=media&token=866085a8-20d0-4822-a9b0-95123d91341c'">
            <b id="current-name" style="display:block;">Carregando...</b>
            <span id="current-artist" style="color:gray;">Aguarde...</span>
            <div id="admin-controls">
                <button onclick="window.spotifyControl('previous')">⏮</button>
                <button onclick="window.spotifyControl('play')">▶/II</button>
                <button onclick="window.spotifyControl('next')">⏭</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://portinha-jukebox-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    // MUDANÇA TOTAL: O Redirect URI agora aponta para a tua GOOGLE BRIDGE
    const GOOGLE_BRIDGE_URL = "https://script.google.com/macros/s/AKfycbze6WhezvXrZwKzJKbrl98ONvWBySpEIKvOFA0PoJfGtiPySfEluPQq_i5mTRSa1nCNuw/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    let accessToken = "";

    window.loginSpotify = () => {
        const scopes = 'user-modify-playback-state user-read-playback-state user-read-currently-playing';
        // Enviamos o Spotify para a Google, e a Google para o site. Adeus CORB!
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(GOOGLE_BRIDGE_URL)}&scope=${encodeURIComponent(scopes)}`;
    };

    onValue(ref(db, 'auth/access_token'), (snap) => {
        accessToken = snap.val();
        if (accessToken) {
            if (isAdmin) {
                document.getElementById('admin-controls').style.display = 'flex';
                document.getElementById('badge').innerText = "STAFF";
            }
            updatePlayer();
            setInterval(updatePlayer, 5000);
        } else if (isAdmin) {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    });

    async function updatePlayer() {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': 'Bearer ' + accessToken }
        });
        if (res.status === 200) {
            const data = await res.json();
            document.getElementById('current-art').src = data.item.album.images[0].url;
            document.getElementById('current-name').innerText = data.item.name;
            document.getElementById('current-artist').innerText = data.item.artists[0].name;
        }
    }
</script>
</body>
</html>
