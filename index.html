<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTINHA - Jukebox</title>
    <style>
        :root {
            --neon-red: #FF0000;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
        }

        .header {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .logo {
            color: var(--neon-red);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Now Playing Card */
        .now-playing {
            background: linear-gradient(145deg, #222, #111);
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--neon-red);
            display: flex;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .album-art {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            margin-right: 20px;
            background: #333;
        }

        .track-info b { font-size: 1.2rem; display: block; margin-bottom: 5px; }
        .track-info span { color: var(--text-gray); font-size: 0.9rem; }

        /* Search Section */
        .search-container { padding: 0 20px; }
        .search-box {
            width: 100%;
            padding: 15px 20px;
            background: #222;
            border: 1px solid #333;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .search-box:focus { border-color: var(--neon-red); }

        /* Results */
        .results-list { margin-top: 20px; }
        .track-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 15px;
            transition: 0.3s;
        }
        .track-item:hover { background: #252525; }

        .btn-add {
            margin-left: auto;
            background: var(--neon-red);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Floating Action Button */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .btn-login {
            background: var(--neon-red);
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="login-section" class="login-overlay">
        <h1 class="logo">Neon Cask</h1>
        <p style="color: var(--text-gray); margin-bottom: 30px;">Jukebox & Whisky Bar</p>
        <button class="btn-login" onclick="loginSpotify()">CONECTAR BAR</button>
    </div>

    <div id="app-section" style="display:none;">
        <div class="header">
            <h2 class="logo">Neon Cask</h2>
        </div>

        <div class="now-playing" id="player">
            <img src="" class="album-art" id="current-art">
            <div class="track-info">
                <span style="color: var(--neon-red); font-size: 0.7rem; font-weight: bold; text-transform: uppercase;">A Tocar Agora</span>
                <b id="current-name">Silêncio...</b>
                <span id="current-artist">Abre o Spotify no Bar</span>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" id="query" placeholder="Pesquisar música ou artista..." oninput="buscar()">
            <div class="results-list" id="results">
                </div>
        </div>
    </div>

<script>
    const CLIENT_ID = '3351b90e625048618d7f976a4f4b5a5a';
    const CLIENT_SECRET = 'O_TEU_SECRET_AQUI'; 
    const REDIRECT_URI = 'https://andreaquino.github.io/jukebox-bar/';

    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    let accessToken = localStorage.getItem('spotify_token');

    async function init() {
        if (authCode) {
            await exchangeCode();
        } else if (accessToken) {
            showApp();
            updatePlayer();
            setInterval(updatePlayer, 5000); // Atualiza o "Now Playing" a cada 5 segundos
        }
    }

    function loginSpotify() {
        const scopes = 'user-modify-playback-state user-read-playback-state user-read-currently-playing';
        window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}`;
    }

    async function exchangeCode() {
        const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
            },
            body: new URLSearchParams({ grant_type: 'authorization_code', code: authCode, redirect_uri: REDIRECT_URI })
        });
        const data = await res.json();
        if (data.access_token) {
            localStorage.setItem('spotify_token', data.access_token);
            window.location.href = REDIRECT_URI;
        }
    }

    function showApp() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
    }

    async function updatePlayer() {
        try {
            const res = await fetch('http://googleusercontent.com/spotify.com/6', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (res.status === 200) {
                const data = await res.json();
                document.getElementById('current-art').src = data.item.album.images[0].url;
                document.getElementById('current-name').innerText = data.item.name;
                document.getElementById('current-artist').innerText = data.item.artists[0].name;
            }
        } catch (e) { console.log("Player inativo"); }
    }

    async function buscar() {
        const q = document.getElementById('query').value;
        if (q.length < 3) return;
        const res = await fetch(`https://api.spotify.com/v1/search?q=${q}&type=track&limit=8`, {
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        let html = '';
        data.tracks.items.forEach(t => {
            html += `
                <div class="track-item">
                    <img src="${t.album.images[0].url}" style="width:50px; border-radius:8px; margin-right:15px;">
                    <div>
                        <b>${t.name}</b><br>
                        <span style="color:gray; font-size:0.8rem">${t.artists[0].name}</span>
                    </div>
                    <button class="btn-add" onclick="enqueue('${t.uri}', '${t.name.replace(/'/g, "")}')">ADICIONAR</button>
                </div>`;
        });
        document.getElementById('results').innerHTML = html;
    }

    async function enqueue(uri, name) {
        const res = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${uri}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (res.ok) alert(name + " adicionada à fila!");
    }

    init();
</script>
</body>
</html>
