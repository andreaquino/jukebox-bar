<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portinha - TV Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body { 
            background-color: #000; 
            color: white; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
        }
        
        #bg-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(100px) brightness(0.35); transform: scale(1.2);
            z-index: -1; transition: background-image 2s ease-in-out;
        }

        .glass-panel { 
            background: rgba(0, 0, 0, 0.25); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        /* BARRA ESTILO SPOTIFY DASHBOARD */
        .progress-container {
            background: rgba(255, 255, 255, 0.15);
            height: 10px;
            border-radius: 99px;
            position: relative;
        }

        .progress-fill {
            background: #ffffff; /* Branco sólido conforme imagem de referência */
            height: 100%;
            border-radius: 99px;
            transition: width 1s linear;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-content { animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>
<body class="h-screen flex flex-col p-16 relative">

    <div id="bg-blur"></div>

    <div class="flex-1 flex items-center gap-16 mb-24 animate-content">
        
        <div class="shrink-0">
            <img id="tv-cover" src="" class="w-[450px] h-[450px] md:w-[550px] md:h-[550px] rounded-[32px] shadow-[0_40px_100px_rgba(0,0,0,0.8)] border border-white/10 object-cover transition-all duration-1000">
        </div>

        <div class="flex-1 flex flex-col justify-center overflow-hidden">
            <h1 id="tv-title" class="text-7xl md:text-8xl font-[900] tracking-tighter leading-[1.1] mb-6 line-clamp-2">...</h1>
            <p id="tv-artist" class="text-4xl md:text-5xl text-white/60 font-medium mb-10 truncate italic">Carregando Jukebox</p>
            
            <div id="tv-suggester-box" class="hidden inline-flex items-center gap-4 px-8 py-3 glass-panel rounded-2xl w-fit">
                <i data-lucide="user" class="text-white/40 w-6 h-6"></i>
                <span class="text-xl font-bold tracking-widest uppercase text-white/80">PEDIDO DE: <span id="tv-suggester" class="text-white">---</span></span>
            </div>
        </div>

        <div class="w-96 glass-panel rounded-[40px] p-10 h-full max-h-[650px] flex flex-col">
            <div class="flex items-center gap-4 mb-10 border-b border-white/10 pb-6">
                <i data-lucide="list-music" class="text-white/40 w-8 h-8"></i>
                <h2 class="text-xl font-black uppercase tracking-[0.2em] text-white/60">A SEGUIR</h2>
            </div>
            <div id="tv-queue-list" class="flex flex-col gap-8 overflow-y-auto">
                </div>
        </div>
    </div>

    <div class="w-full max-w-[95%] mx-auto mt-auto animate-content" style="animation-delay: 0.3s;">
        <div class="flex justify-between items-end mb-6 px-2">
            <span id="tv-current-time" class="text-3xl font-bold font-mono opacity-40">0:00</span>
            <span id="tv-total-time" class="text-3xl font-bold font-mono opacity-40">0:00</span>
        </div>
        <div class="progress-container">
            <div id="tv-progress" class="progress-fill" style="width: 0%"></div>
        </div>
    </div>

    <div class="absolute top-16 right-16 opacity-20">
        <h2 class="text-3xl font-black italic tracking-tighter">PORTINHA</h2>
    </div>

    <script>
        const supabaseUrl = 'https://tgbyxogyrugjfggugigf.supabase.co';
        const supabaseKey = 'sb_publishable_MJFbecAQa8GZ4LdNb5ruew_9N9bg2ro';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let localProgressMs = 0;
        let durationMs = 0;
        let progressTimer = null;

        function formatTime(ms) {
            if (!ms || ms < 0) return "0:00";
            const min = Math.floor(ms / 60000);
            const sec = Math.floor((ms % 60000) / 1000);
            return min + ":" + (sec < 10 ? '0' : '') + sec;
        }

        function startLocalClock() {
            if (progressTimer) clearInterval(progressTimer);
            progressTimer = setInterval(() => {
                if (localProgressMs < durationMs) {
                    localProgressMs += 1000;
                    const percent = (localProgressMs / durationMs) * 100;
                    document.getElementById('tv-progress').style.width = percent + '%';
                    document.getElementById('tv-current-time').innerText = formatTime(localProgressMs);
                }
            }, 1000);
        }

        function updateTVUI(data) {
            localProgressMs = data.progress_ms;
            durationMs = data.duration_ms;

            document.getElementById('tv-title').innerText = data.title;
            document.getElementById('tv-artist').innerText = data.artist;
            document.getElementById('tv-cover').src = data.cover_url;
            document.getElementById('bg-blur').style.backgroundImage = `url('${data.cover_url}')`;
            document.getElementById('tv-total-time').innerText = formatTime(data.duration_ms);

            if (data.user_name && data.user_name !== "Spotify") {
                document.getElementById('tv-suggester-box').classList.remove('hidden');
                document.getElementById('tv-suggester').innerText = data.user_name;
            } else {
                document.getElementById('tv-suggester-box').classList.add('hidden');
            }

            startLocalClock();
        }

        async function fetchTVQueue() {
            const { data } = await supabaseClient.from('queue').select('*').eq('status', 'pending').order('votes', { ascending: false }).limit(5);
            const container = document.getElementById('tv-queue-list');
            container.innerHTML = "";

            (data || []).forEach(song => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-6 opacity-80";
                div.innerHTML = `
                    <img src="${song.cover_url}" class="w-20 h-20 rounded-2xl object-cover shadow-lg">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-2xl font-bold text-white truncate mb-1">${song.title}</p>
                        <p class="text-sm text-white/40 uppercase font-bold tracking-widest">${song.user_name}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function initTV() {
            const { data } = await supabaseClient.from('playback_status').select('*').eq('id', 1).single();
            if (data) updateTVUI(data);

            supabaseClient.channel('tv_playback').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'playback_status' }, payload => updateTVUI(payload.new)).subscribe();
            supabaseClient.channel('tv_queue').on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, () => fetchTVQueue()).subscribe();
            fetchTVQueue();
        }

        initTV();
        lucide.createIcons();
    </script>
</body>
</html>
