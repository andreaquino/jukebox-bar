<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Jukebox - TV Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #000; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Fundo dinâmico com blur */
        #bg-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.4); transform: scale(1.1);
            z-index: -1; transition: background-image 1.5s ease-in-out;
        }

        .glass { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .progress-smooth { transition: width 1s linear; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-song { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col p-12 relative">

    <div id="bg-blur"></div>

    <div class="flex-1 flex items-end gap-10 mb-12">
        
        <div class="flex flex-col gap-6 flex-[2] animate-song">
            <div class="flex items-center gap-8">
                <img id="tv-cover" src="" class="w-48 h-48 rounded-xl shadow-2xl border border-white/20">
                <div class="overflow-hidden">
                    <h1 id="tv-title" class="text-7xl font-black tracking-tighter mb-2 truncate">Aguardando...</h1>
                    <p id="tv-artist" class="text-4xl text-white/70 font-medium truncate">Liga o som no PC Admin</p>
                    <p id="tv-suggester" class="text-xl text-neonCyan mt-4 font-bold tracking-widest uppercase opacity-80"></p>
                </div>
            </div>
        </div>

        <div class="flex-1 glass rounded-3xl p-8 max-h-[500px] overflow-hidden flex flex-col">
            <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                <i data-lucide="list-music" class="text-neonPink w-6 h-6"></i>
                <h2 class="text-xl font-bold uppercase tracking-widest">A seguir</h2>
            </div>
            <div id="tv-queue-list" class="flex flex-col gap-4 overflow-y-auto">
                </div>
        </div>
    </div>

    <div class="w-full">
        <div class="flex justify-between text-sm font-mono text-white/50 mb-2">
            <span id="tv-current-time">0:00</span>
            <span id="tv-total-time">0:00</span>
        </div>
        <div class="w-full bg-white/10 h-3 rounded-full overflow-hidden border border-white/5">
            <div id="tv-progress" class="bg-gradient-to-r from-neonCyan to-neonPink h-full progress-smooth" style="width: 0%"></div>
        </div>
    </div>

    <div class="absolute top-12 right-12 text-right">
        <h2 class="text-2xl font-black text-white/20 italic tracking-tighter">NEON JUKEBOX</h2>
        <p class="text-[10px] text-white/10 tracking-[0.5em] uppercase">Sugere a tua música no site</p>
    </div>

    <script>
        const supabaseUrl = 'https://tgbyxogyrugjfggugigf.supabase.co';
        const supabaseKey = 'sb_publishable_MJFbecAQa8GZ4LdNb5ruew_9N9bg2ro';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        function formatTime(ms) {
            if (!ms) return "0:00";
            const min = Math.floor(ms / 60000);
            const sec = ((ms % 60000) / 1000).toFixed(0);
            return min + ":" + (sec < 10 ? '0' : '') + sec;
        }

        async function initTV() {
            // Estado inicial
            const { data } = await supabaseClient.from('playback_status').select('*').eq('id', 1).single();
            if (data) updateTVUI(data);

            // Ouvir mudanças no Spotify (via Broadcast do Admin)
            supabaseClient.channel('tv_playback').on('postgres_changes', { 
                event: 'UPDATE', schema: 'public', table: 'playback_status' 
            }, payload => updateTVUI(payload.new)).subscribe();

            // Ouvir a Fila
            supabaseClient.channel('tv_queue').on('postgres_changes', { 
                event: '*', schema: 'public', table: 'queue' 
            }, () => fetchTVQueue()).subscribe();
            
            fetchTVQueue();
        }

        function updateTVUI(data) {
            document.getElementById('tv-title').innerText = data.title;
            document.getElementById('tv-artist').innerText = data.artist;
            document.getElementById('tv-cover').src = data.cover_url;
            document.getElementById('bg-blur').style.backgroundImage = `url('${data.cover_url}')`;
            document.getElementById('tv-suggester').innerText = data.user_name !== "Spotify" ? "Sugerida por: " + data.user_name : "";
            
            const percent = (data.progress_ms / data.duration_ms) * 100;
            document.getElementById('tv-progress').style.width = percent + '%';
            document.getElementById('tv-current-time').innerText = formatTime(data.progress_ms);
            document.getElementById('tv-total-time').innerText = formatTime(data.duration_ms);
        }

        async function fetchTVQueue() {
            const { data } = await supabaseClient.from('queue').select('*').eq('status', 'pending').order('votes', { ascending: false }).limit(4);
            const container = document.getElementById('tv-queue-list');
            container.innerHTML = "";

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-white/20 italic text-sm text-center py-10">Fila vazia... Sê o primeiro!</p>`;
                return;
            }

            data.forEach(song => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 bg-white/5 p-3 rounded-2xl animate-song";
                div.innerHTML = `
                    <img src="${song.cover_url}" class="w-12 h-12 rounded-lg">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-sm font-bold text-white truncate">${song.title}</p>
                        <p class="text-[10px] text-neonCyan uppercase font-mono truncate">${song.user_name}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        initTV();
        lucide.createIcons();
    </script>
</body>
</html>
