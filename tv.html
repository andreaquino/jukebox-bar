<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Jukebox - TV DISPLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Fundo desfocado dinâmico */
        #bg-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(80px) brightness(0.4); transform: scale(1.1);
            z-index: -1; transition: background-image 2s ease-in-out;
        }

        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); }
        .progress-bar { transition: width 1s linear; box-shadow: 0 0 15px #00ffff; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        .queue-item { animation: slideIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex p-10 gap-10">

    <div id="bg-blur"></div>

    <div class="flex-[2] flex flex-col justify-center items-center">
        <div class="relative group">
            <img id="tv-cover" src="https://via.placeholder.com/600" class="w-[500px] h-[500px] rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] border-4 border-white/10 transition-all duration-1000">
            <div class="absolute -bottom-5 -right-5 bg-neonPink p-4 rounded-2xl rotate-3 shadow-xl">
                <i data-lucide="disc-3" class="w-8 h-8 text-white animate-spin"></i>
            </div>
        </div>

        <div class="mt-12 text-center max-w-2xl">
            <h1 id="tv-title" class="text-6xl font-black mb-4 tracking-tighter">Aguardando...</h1>
            <p id="tv-artist" class="text-3xl text-gray-300 font-light italic">Sincronizando com o Bar</p>
            
            <div id="tv-suggester-box" class="mt-8 inline-block px-6 py-2 glass rounded-full text-neonCyan font-bold tracking-widest text-sm uppercase">
                PEDIDA POR: <span id="tv-suggester">---</span>
            </div>
        </div>

        <div class="w-full max-w-3xl bg-white/10 h-4 rounded-full mt-12 overflow-hidden border border-white/5">
            <div id="tv-progress" class="bg-gradient-to-r from-neonCyan to-neonPink h-full progress-bar" style="width: 0%"></div>
        </div>
    </div>

    <div class="flex-1 glass rounded-[40px] p-8 flex flex-col overflow-hidden border-l border-white/20">
        <div class="flex items-center gap-3 mb-8 border-b border-white/10 pb-4">
            <i data-lucide="list-music" class="text-neonPink w-8 h-8"></i>
            <h2 class="text-2xl font-black uppercase tracking-widest">Próximas Músicas</h2>
        </div>

        <div id="tv-queue-list" class="flex flex-col gap-6 overflow-y-auto pr-4">
            </div>

        <div class="mt-auto pt-6 text-center text-gray-500 text-xs font-mono uppercase tracking-[0.3em]">
            Pede a tua música em: <br>
            <span class="text-white">andreaquino.github.io/jukebox-bar/</span>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://tgbyxogyrugjfggugigf.supabase.co';
        const supabaseKey = 'sb_publishable_MJFbecAQa8GZ4LdNb5ruew_9N9bg2ro';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- ESCUTAR O STATUS (BROADCAST DO PC ADMIN) ---
        async function initTV() {
            // Ler estado inicial
            const { data } = await supabaseClient.from('playback_status').select('*').eq('id', 1).single();
            if (data) updateTVUI(data);

            // Ouvir atualizações em tempo real
            supabaseClient.channel('tv_channel').on('postgres_changes', { 
                event: 'UPDATE', schema: 'public', table: 'playback_status' 
            }, payload => {
                updateTVUI(payload.new);
            }).subscribe();
        }

        function updateTVUI(data) {
            document.getElementById('tv-title').innerText = data.title;
            document.getElementById('tv-artist').innerText = data.artist;
            document.getElementById('tv-cover').src = data.cover_url;
            document.getElementById('bg-blur').style.backgroundImage = `url('${data.cover_url}')`;
            document.getElementById('tv-suggester').innerText = data.user_name;
            
            const percent = (data.progress_ms / data.duration_ms) * 100;
            document.getElementById('tv-progress').style.width = percent + '%';
        }

        // --- ESCUTAR A FILA ---
        async function fetchTVQueue() {
            const { data } = await supabaseClient.from('queue')
                .select('*')
                .eq('status', 'pending')
                .order('votes', { ascending: false })
                .limit(5); // Mostra apenas as 5 próximas na TV

            const container = document.getElementById('tv-queue-list');
            container.innerHTML = "";

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-40 text-gray-600 italic">
                        <p>Fila vazia...</p>
                        <p class="text-[10px]">Sugere uma música!</p>
                    </div>`;
                return;
            }

            data.forEach(song => {
                const div = document.createElement('div');
                div.className = "queue-item flex items-center gap-4 bg-white/5 p-4 rounded-3xl border border-white/5 shadow-lg";
                div.innerHTML = `
                    <img src="${song.cover_url}" class="w-16 h-16 rounded-xl">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-lg font-bold text-white truncate">${song.title}</p>
                        <p class="text-xs text-neonCyan uppercase font-mono tracking-widest">${song.user_name}</p>
                    </div>
                    <div class="bg-white/10 px-3 py-1 rounded-full text-xs font-black">
                        ❤️ ${song.votes}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Realtime para a fila
        supabaseClient.channel('queue_tv').on('postgres_changes', { 
            event: '*', schema: 'public', table: 'queue' 
        }, () => fetchTVQueue()).subscribe();

        // Inicializar
        initTV();
        fetchTVQueue();
        lucide.createIcons();
    </script>
</body>
</html>
